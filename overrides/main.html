{% extends "base.html" %}
{% block extrahead %}
<script>/*theme: before paint; explicit choice persists, else system*/(function(){try{var d=document.documentElement,k=new URL('{{ base_url }}/',location).pathname.replace(/\/+$/,'/')+'.__palette',mq=matchMedia('(prefers-color-scheme: dark)'),p=null;try{p=JSON.parse(localStorage.getItem(k)||'null')}catch(e){}if(!localStorage.getItem('pwth2')){localStorage.setItem('pwth2','1');if(localStorage.getItem('pp26th')&&p&&p.color&&p.color.scheme=='default')p=null}var s=p&&p.color&&p.color.scheme;if(!p||p.auto||(s!='slate'&&s!='default')){s=mq.matches?'slate':'default';p={index:s=='slate'?0:1,auto:1,color:{media:'',scheme:s,primary:'custom',accent:'custom'}};localStorage.setItem(k,JSON.stringify(p));if(mq.addEventListener)mq.addEventListener('change',function(e){var q=JSON.parse(localStorage.getItem(k)||'{}');if(!q.auto)return;var v=e.matches?'slate':'default';q.index=v=='slate'?0:1;q.color.scheme=v;localStorage.setItem(k,JSON.stringify(q));d.setAttribute('data-md-color-scheme',v);document.body&&document.body.setAttribute('data-md-color-scheme',v)})}d.setAttribute('data-md-color-scheme',s);d.style.colorScheme=s=='slate'?'dark':'light'}catch(e){}})()</script>
<script>(function(){var l=location,on=true;try{if(/[?&]pp26=0/.test(l.search))localStorage.setItem('pp26off','1');if(/[?&]pp26=1/.test(l.search))localStorage.removeItem('pp26off');on=localStorage.getItem('pp26off')!='1'}catch(e){}if(on){document.documentElement.classList.add('pp26');setTimeout(function(){document.documentElement.classList.add('pp-ready')},3000);document.write('<link rel="stylesheet" href="{{ base_url }}/assets/pp26.css"><script defer src="{{ base_url }}/assets/pp26.js"><\/script><link rel="preload" as="font" type="font/woff2" crossorigin href="{{ base_url }}/assets/fonts26/Unbounded-600-cyrillic.woff2"><link rel="preload" as="font" type="font/woff2" crossorigin href="{{ base_url }}/assets/fonts26/Manrope-400-cyrillic.woff2"><link rel="preload" as="font" type="font/woff2" crossorigin href="{{ base_url }}/assets/fonts26/Manrope-400-latin.woff2">')}})()</script>
<link rel="manifest" href="{{ base_url }}/manifest.webmanifest">
<meta name="theme-color" content="#1596c9">
<link rel="apple-touch-icon" href="{{ base_url }}/assets/icon-192.png">
{% if page and page.meta and page.meta.leaflet %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
{% endif %}
{% endblock %}
