site_name: Энциклопедия Palworld
site_url: https://39den.github.io/palwiki/
site_description: Энциклопедия Palworld на русском — палы, боссы, предметы, пассивки, разведение
docs_dir: docs
theme:
  name: material
  custom_dir: overrides
  language: ru
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: Nunito
    code: JetBrains Mono
  features: [navigation.tabs, navigation.tabs.sticky, navigation.top, navigation.indexes, search.suggest, search.highlight, content.code.copy]
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Тёмная тема}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Светлая тема}
plugins:
  - search:
      lang: [ru, en]
extra_css: [assets/extra.css]
extra_javascript: [assets/smart.js, assets/site.js]
markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
nav:
- Главная: index.md
- Галерея: gallery.md
- Карта: map.md
- Сравнить: compare.md
- Гайд:
  - Начни здесь:
    - Влияние патчей (что поменялось и что это значит для тебя): 0_nachni_zdes/patchi.md
    - Управление на ПК (клавиши по умолчанию): 0_nachni_zdes/upravlenie.md
    - Что такое Palworld и с чего начать: 0_nachni_zdes/nachni_zdes.md
  - Гайд по темам:
    - Баги и проблемы - что делать: guide/15_problemy.md
    - База - всё о строительстве и работе палов: guide/09_baza.md
    - Боссы - башни, рейды, альфы, подземелья: guide/10_bossy.md
    - Влияние патчей (что поменялось и что это значит для тебя): guide/patchi.md
    - Еда и баффы: guide/eda.md
    - Как ловить палов: guide/05_lovlya.md
    - Как сделать пала сильнее (все способы): guide/08_usilenie.md
    - Координаты (карта): guide/koordinaty.md
    - Механики для знатоков (цифры и формулы): guide/14_mehaniki.md
    - Мир - регионы, перемещение, торговцы, рыбалка, экспедиции, нефтевышки: guide/11_mir.md
    - Партнёрские навыки - как они включаются: guide/partnerskie_navyki.md
    - Персонаж - уровень, статы, сброс, смерть: guide/04_personazh.md
    - Прохождение от 0 до 80 уровня (пошагово): guide/03_prohozhdenie_1_80.md
    - Разведение (Breeding): guide/07_razvedenie.md
    - Свой сервер и игра с друзьями: guide/12_server.md
    - Секреты и пасхалки: guide/sekrety.md
    - Стихии - кто кого бьёт: guide/06_stihii.md
    - Управление на ПК (клавиши по умолчанию): guide/02_upravlenie.md
    - Фарм и лут - где брать всё: guide/13_farm.md
    - Что такое Palworld и с чего начать: guide/01_chto_eto.md
    - Эндгейм 75–80 - как стать сильнее (бой палами): guide/16_endgame_75_80.md
  - Прохождение:
    - Прохождение от 0 до 80 уровня (пошагово): 1_prohozhdenie/prohozhdenie_0_80.md
    - Эндгейм 75–80 - как стать сильнее (бой палами): 1_prohozhdenie/endgame_75_80.md
