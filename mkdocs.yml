site_name: Энциклопедия Palworld
site_url: https://39den.github.io/palwiki/
site_description: Энциклопедия Palworld на русском — палы, боссы, предметы, пассивки, разведение
docs_dir: docs
copyright: "Данные: версия игры 1.0.5 · фан-энциклопедия, не официальный продукт"
theme:
  name: material
  custom_dir: overrides
  language: ru
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: Manrope
    code: JetBrains Mono
  features: [navigation.path, content.tabs.link,navigation.tabs, navigation.tabs.sticky, navigation.top, navigation.indexes, search.suggest, content.code.copy]
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Светлая тема}
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Тёмная тема}
plugins:
  - search:
      lang: [ru, en]
extra_css: ['assets/extra.css?v=1792577783']
extra_javascript: ['assets/smart.js?v=1792577783', 'assets/site.js?v=1792577783', 'assets/features.js?v=1792577783', 'assets/ui2.js?v=1792577783', 'assets/ui3.js?v=1792577783']
markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: false
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
extra:
  generator: false
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/PalGuideBot
      name: "@PalGuideBot"
